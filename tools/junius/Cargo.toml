[package]
name         = "junius"
version      = "0.0.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
publish      = false

[[bin]]
name = "junius"
path = "src/main.rs"

[dependencies]
junius-manifest = { workspace = true }

clap               = { workspace = true }
miette             = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# Migration runner (M06)
sqlx     = { workspace = true }
sha2     = { workspace = true }
petgraph = { workspace = true }

[dev-dependencies]
insta      = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }

# Ephemeral Postgres for the migration-runner integration tests (M06).
# junius-manifest/sqlx/tokio are also normal deps; integration-test crates can
# only name dev-dependencies, so they're repeated here.
junius-manifest        = { workspace = true }
sqlx                   = { workspace = true }
tokio                  = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
