[package]
name         = "junius"
version      = "0.0.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
publish      = false

[[bin]]
name = "junius"
path = "src/main.rs"

[features]
# `develop` gates the source-tree-only subcommands (`new`, `sync`, `dev`, `rpc`)
# so an end-user deployment build ships a CLI without the source-tree authoring
# surface. `source-build` (M24) further gates `build`, `cache`, and
# `plugin {enable,disable}` so the in-container `junius` inside the precompiled
# images has only the runtime-relevant commands (`check`, `migrate`,
# `plugin {list,info}`, `i18n`, `provision`). The default leaves both on so
# in-source and source-built deployments are unaffected.
default = ["develop", "source-build"]
develop = []
source-build = []

[dependencies]
junius-manifest   = { workspace = true }
junius-i18n-build = { workspace = true }
junius-provision  = { workspace = true }
junius-rpc-meta   = { workspace = true }

clap               = { workspace = true }
miette             = { workspace = true }
regex              = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# M18 `junius oidc resync` is a thin Connect-JSON client to a running juniusd.
reqwest  = { workspace = true }

# Migration runner (M06)
sqlx     = { workspace = true }
sha2     = { workspace = true }
petgraph = { workspace = true }
# M18 `junius provision` resolves UUID-keyed group/role rows from the DB.
uuid     = { workspace = true }

# Cross-plugin SQL analysis (M09 `junius check`); `visitor` (M12) enables
# `visit_relations` to collect every table reference generically.
sqlparser = { workspace = true, features = ["visitor"] }
# M12: parse plugin Rust source to pull SQL out of sqlx `query*!` macros.
syn = { workspace = true, features = ["visit"] }
# M15 `junius rpc scaffold`: stringify ctx-parameter type fragments without
# adding a custom Display walker.
quote = { workspace = true }

# Source resolution (M11): blake3 content hashes for platform.lock.
blake3 = { workspace = true }
# Comment-preserving platform.toml edits (`junius plugin enable/disable`).
toml_edit = { workspace = true }

[dev-dependencies]
insta      = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile   = { workspace = true }

# Ephemeral Postgres for the migration-runner integration tests (M06).
# junius-manifest/sqlx/tokio are also normal deps; integration-test crates can
# only name dev-dependencies, so they're repeated here.
junius-manifest        = { workspace = true }
sqlx                   = { workspace = true }
tokio                  = { workspace = true }
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
