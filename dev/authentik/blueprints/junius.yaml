# Authentik blueprint: seed the `junius` OIDC application + provider and two test
# users for local dev. Applied automatically by the worker on boot (mounted at
# /blueprints/custom). client_id/secret are fixed here so they match
# dev/platform.toml's oidc_client_id and the OIDC_CLIENT_SECRET env var.
#
# Written for the Authentik version pinned in docker-compose.yml (2024.12). The
# OAuth2 provider schema is version-sensitive — notably `redirect_uris` is a list
# of {matching_mode, url} objects (not a string), and `invalidation_flow` +
# `signing_key` are required. Dev-only; never used by CI.
version: 1
metadata:
  name: junius-dev
entries:
  # OIDC provider for the platform. `id` is what `!KeyOf` below references
  # (KeyOf resolves an entry's `id`, not its identifiers).
  - model: authentik_providers_oauth2.oauth2provider
    id: junius-provider
    identifiers:
      name: junius-provider
    attrs:
      client_type: confidential
      client_id: platform
      client_secret: dev-oidc-secret
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      redirect_uris:
        # Vite dev origin (junius dev) — single-origin login round-trip.
        - matching_mode: strict
          url: "http://localhost:5173/api/auth/callback"
        # Embedded SPA served directly by juniusd (junius build + ./juniusd).
        - matching_mode: strict
          url: "http://localhost:18080/api/auth/callback"
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        # M18: emit the user's group names as a `groups` claim so the host's
        # OIDC reconciler can map Authentik groups → Junius (group, role).
        - !KeyOf junius-groups-scope

  # Custom scope mapping (Authentik ships none for `groups` by default): returns
  # the caller's group names under the `groups` claim. The host reads it at
  # login and via `junius oidc resync` / the UserService RPC.
  - model: authentik_providers_oauth2.scopemapping
    id: junius-groups-scope
    identifiers:
      name: junius-groups
    attrs:
      scope_name: groups
      description: "Junius: the caller's group names"
      expression: |
        return {"groups": [group.name for group in request.user.ak_groups.all()]}

  # Two dev groups the M18 OIDC → Junius mapping can target. Alice organises;
  # Bob is a member. Define an `oidc_group_mapping` row (via the admin UI or
  # dev/provisioning.toml) to map these onto Junius groups/roles.
  - model: authentik_core.group
    id: junius-organisers-group
    identifiers:
      name: junius-organisers
  - model: authentik_core.group
    id: junius-members-group
    identifiers:
      name: junius-members

  # Application bound to the provider, exposed at /application/o/junius/.
  - model: authentik_core.application
    identifiers:
      slug: junius
    attrs:
      name: Junius
      provider: !KeyOf junius-provider

  # Test users. Set their passwords in the Authentik admin UI (akadmin /
  # akadmin-dev) on first run — blueprints don't carry plaintext passwords.
  - model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      name: Alice Example
      email: alice@example.com
      is_active: true
      groups:
        - !KeyOf junius-organisers-group
  - model: authentik_core.user
    identifiers:
      username: bob
    attrs:
      name: Bob Example
      email: bob@example.com
      is_active: true
      groups:
        - !KeyOf junius-members-group
