# Local dev stack for Junius. Stage A (M06) brings up Postgres for the platform.
# The Authentik OIDC stack is added alongside the auth backend (M06 stage B).
#
#   docker compose -f dev/docker-compose.yml up -d
#
# The platform connects as platform_migrator (see dev/platform.toml [config]).

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: platform_migrator
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_migrator -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
