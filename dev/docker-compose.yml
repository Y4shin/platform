# Local dev stack for Junius:
#   - postgres:       the platform database (connected as platform_migrator)
#   - authentik-*:    a real OIDC provider for local login (server + worker +
#                     its own postgres + redis, per Authentik's standard topology)
#
#   docker compose -f dev/docker-compose.yml up -d
#
# Before running `junius dev` / `junius migrate up`, export the secrets the
# deployment config references (see dev/platform.toml [config]):
#   export OIDC_CLIENT_SECRET=dev-oidc-secret   # must match dev/authentik blueprint
#   export SESSION_KEY=dev-session-key
#   export ROLE_PW_SECRET=dev-role-pw-secret
#
# Authentik takes a couple of minutes to become healthy on first boot and apply
# the blueprint in dev/authentik/blueprints/. See dev/authentik/README.md.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: platform_migrator
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_migrator -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-dev
      POSTGRES_DB: authentik
    volumes:
      - authentik-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.12.5
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: dev-authentik-secret-key-change-in-prod
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-dev
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: akadmin-dev
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@local
    ports:
      - "9000:9000"
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12.5
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: dev-authentik-secret-key-change-in-prod
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-dev
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: akadmin-dev
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@local
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  # --- M10 infra capabilities ---

  # Jobs: RabbitMQ (broker :5672, management UI :15672).
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Storage: MinIO (S3-compatible). Remapped to 9100/9101 — Authentik holds 9000.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - minio-data:/data

  # Email: mailpit (SMTP :1025, web UI :8025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Telemetry: Grafana LGTM all-in-one (OTLP/gRPC :4317, Grafana UI :3000).
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "4317:4317"
      - "3000:3000"
    volumes:
      - lgtm-data:/data

volumes:
  postgres-data:
  authentik-db:
  rabbitmq-data:
  minio-data:
  lgtm-data:
