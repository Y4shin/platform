# Dev sandbox deployment config. `junius sync` consumes this to compose the
# host with the listed plugins. Not a real deployment — see design §5.5.

[source]
path = "."

[plugins]
enabled = ["events", "admin"]

# M18 Stage D: declarative starting state. The block lives in a separate
# file so a re-`apply` is grep-friendly + diff-friendly. `apply` is
# hash-guarded — re-runs with the same content are a single audit event;
# `auto_apply_on_boot = true` (default) means juniusd reconciles on every
# restart at near-zero cost.
[provisioning]
file = "provisioning.toml"

# Host configuration. Secrets use `env:VAR` indirection so they aren't committed;
# export OIDC_CLIENT_SECRET / SESSION_KEY / ROLE_PW_SECRET before running the
# host or `junius migrate`. See dev/docker-compose.yml for the local stack.
[config]
database_url           = "postgres://platform_migrator:dev-only@localhost:5432/platform"
oidc_issuer            = "http://localhost:9000/application/o/junius/"
oidc_client_id         = "platform"
oidc_client_secret     = "env:OIDC_CLIENT_SECRET"
session_encryption_key = "env:SESSION_KEY"
role_password_secret   = "env:ROLE_PW_SECRET"
# Browser-facing OIDC callback. Pointed at the Vite dev origin (:5173) so
# `junius dev` logins round-trip through the single dev origin Vite proxies;
# Vite forwards /api → juniusd (:18080). Must match a redirect_uri registered in
# dev/authentik/blueprints/junius.yaml. Omit in prod to derive it from bind_addr.
oidc_redirect_url      = "http://localhost:5173/api/auth/callback"
# Job worker concurrency (M10).
job_workers            = 4

# --- M10 infra capabilities (see dev/docker-compose.yml for the local stack) ---

# Jobs over RabbitMQ.
[config.jobs]
amqp_url = "amqp://guest:guest@localhost:5672/%2f"

# Telemetry export to the Grafana LGTM stack (OTLP/gRPC).
[config.otel]
enabled  = true
endpoint = "http://localhost:4317"

# Audit-log retention (the host prune task deletes older rows).
[config.audit]
retention_days = 365

# Email via the dev mailpit container (SMTP :1025, web UI :8025).
[config.email]
transport              = "mailpit"
from_default           = "no-reply@local"
allowed_sender_domains = ["local", "platform.example"]

[config.email.mailpit]
host = "localhost"
port = 1025

# Object storage via the dev MinIO container. MinIO is remapped to 9100/9101
# because Authentik holds :9000. Secrets use env: indirection (see DEV_SECRETS
# in Taskfile.yml).
[config.storage]
token_secret = "env:STORAGE_TOKEN_SECRET"

[config.storage.buckets.main]
endpoint       = "http://localhost:9100"
region         = "us-east-1"
bucket         = "platform-dev"
access_key     = "env:MINIO_USER"
secret_key     = "env:MINIO_PASS"
use_path_style = true
presigned_put  = true
presigned_get  = true
public_get     = false

# Logical → physical bucket mapping. `junius check` requires every plugin's
# declared logical bucket to appear here (STORAGE.BUCKET.UNMAPPED).
[config.storage.mapping]
