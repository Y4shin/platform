# Junius dev tasks. Run inside `nix develop` (tools are on PATH).
#   task            — list tasks
#   task test       — run the whole test suite
#   task ci         — the full CI gate
#   task fmt        — apply all formatters
version: "3"

vars:
  CONFIG: dev/platform.toml
  # Throwaway dev secrets (mirror dev/docker-compose.yml + dev/authentik/README).
  # M10 adds MinIO creds + the storage token secret.
  DEV_SECRETS: OIDC_CLIENT_SECRET=dev-oidc-secret SESSION_KEY=dev-session-key ROLE_PW_SECRET=dev-role-pw-secret MINIO_USER=minioadmin MINIO_PASS=minioadmin STORAGE_TOKEN_SECRET=dev-storage-token

  # Machine capacity, probed once at startup. The fetch command is chosen by OS.
  # Logical CPUs (threads): nproc (Linux) / sysctl (macOS) / env var (Windows).
  AVAILABLE_THREADS:
    sh: >-
      {{if eq OS "darwin"}}sysctl -n hw.logicalcpu{{else if eq OS "windows"}}echo $NUMBER_OF_PROCESSORS{{else}}nproc{{end}}
  # Total physical RAM in MB: /proc/meminfo (Linux) / sysctl (macOS) /
  # CIM (Windows).
  TOTAL_RAM_MB:
    sh: >-
      {{if eq OS "darwin"}}echo $(( $(sysctl -n hw.memsize) / 1048576 )){{else if eq OS "windows"}}powershell -NoProfile -Command "[math]::Floor((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1MB)"{{else}}awk '/MemTotal/ {print int($2 / 1024)}' /proc/meminfo{{end}}

env:
  # Repository `query!` macros check against the committed `.sqlx/` offline cache.
  SQLX_OFFLINE: "true"

  # Estimate how many parallel jobs cargo can run without OOMing: budget ~60% of
  # total RAM as peak build usage, at ~2 GB per job, capped at the thread count
  # (min 1). Heavy debug/link jobs are memory-hungry, so on low-RAM / WSL boxes
  # this throttles parallelism while still using every core when RAM allows.
  # Override by exporting CARGO_BUILD_JOBS before running task.
  CARGO_BUILD_JOBS:
    sh: |
      threads={{.AVAILABLE_THREADS}}
      total_mb={{.TOTAL_RAM_MB}}
      peak_mb=$((total_mb * 60 / 100))
      by_ram=$((peak_mb / 2048))
      jobs=$threads
      if [ "$by_ram" -lt "$jobs" ]; then jobs=$by_ram; fi
      if [ "$jobs" -lt 1 ]; then jobs=1; fi
      echo "$jobs"

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list-all
    silent: true

  # --- tests ----------------------------------------------------------------

  test:
    desc: Run the whole test suite (Rust + JS + E2E).
    cmds:
      - task: test:rust
      - task: test:js
      - task: test:e2e

  test:rust:
    desc: Rust workspace tests (testcontainers integration tests need Docker).
    cmds:
      - cargo test --workspace

  test:rust:unit:
    desc: DB-less Rust unit tests only (lib + bin targets; no testcontainers).
    cmds:
      - cargo test --workspace --lib --bins

  test:js:
    desc: Frontend unit tests (vitest) + TypeScript typecheck.
    cmds:
      - pnpm test
      - pnpm run typecheck

  test:e2e:
    desc: Playwright browser E2E. Spins an ephemeral testcontainers stack (Postgres + RabbitMQ + MinIO + mailpit) and the embedded juniusd; needs Docker.
    cmds:
      - |
        if ! docker info >/dev/null 2>&1; then
          echo "task test:e2e — skipped: Docker is not reachable."
          echo "  Start Docker (or skip this gate locally; CI always runs it)."
          echo "  Deterministic enabled/disabled coverage runs in task test:js."
          exit 0
        fi
        set -euo pipefail
        pnpm exec lingui compile
        pnpm --filter @junius/shell build
        cargo build --release -p platform --features embed-frontend
        pnpm exec tsx e2e/run-suite.ts

  test:e2e:clean:
    desc: Force-remove any leftover testcontainers from interrupted E2E runs.
    cmds:
      - |
        ids=$(docker ps -aq --filter label=junius-e2e-run 2>/dev/null || true)
        if [ -n "$ids" ]; then
          docker rm -f $ids
        fi

  # --- format / lint --------------------------------------------------------

  fmt:
    desc: Apply all formatters (Rust, TS/JS, proto).
    cmds:
      - cargo fmt
      - pnpm exec biome format --write .
      - pnpm exec buf format -w

  lint:
    desc: Lint everything (clippy, biome, buf, junius check).
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings
      # The end-user CLI (no `develop` feature) must still compile — proves the
      # source-tree-only subcommands are cleanly gated.
      - cargo build -p junius --no-default-features
      - pnpm exec biome ci
      - pnpm exec buf lint
      - cargo run -q -p junius -- check --manifest {{.CONFIG}}

  buf:breaking:
    desc: Detect breaking proto changes against a git ref (default the `main` branch).
    cmds:
      - pnpm exec buf breaking --against '{{.AGAINST | default ".git#branch=main"}}'

  # --- gates ----------------------------------------------------------------

  ci:
    desc: Full local CI gate (formatting, lint, tests, buf format, i18n, E2E if Docker present).
    aliases: [check]
    cmds:
      - cargo fmt --check
      - task: lint
      - task: test:rust
      - task: test:js
      - pnpm exec buf format --diff --exit-code
      - task: ci:i18n
      - task: test:e2e # auto-skips when Docker is unreachable

  # --- CI jobs (mirror the four parallel GitHub Actions jobs) ----------------
  # `task ci` above runs everything serially for local use; CI runs these
  # slices in parallel. `ci:integration` needs a Postgres + DATABASE_URL +
  # DEV_SECRETS (the workflow provides them); the others are infra-free.

  ci:lint:
    desc: Static checks — fmt, clippy, no-default build, biome, buf lint/format.
    cmds:
      - cargo fmt --check
      - task: lint
      - pnpm exec buf format --diff --exit-code

  ci:check:
    desc: Build + Rust tests + JS tests + buf breaking.
    cmds:
      - cargo build --workspace
      - task: test:rust
      - task: test:js
      - task: buf:breaking

  ci:integration:
    desc: Layer 2 — migrate the example deployment + verify the .sqlx cache.
    cmds:
      - "{{.DEV_SECRETS}} cargo run -q -p junius -- migrate up --config {{.CONFIG}}"
      - task: sqlx:check

  ci:deployment:
    desc: Validate the example deployment build (resolve + config, no compile).
    cmds:
      - cargo build -p junius --release
      - cd examples/example-deployment && ../../target/release/junius build --check-config

  ci:e2e:
    desc: M17 sixth job — Playwright E2E. Ephemeral testcontainers stack + embedded juniusd; no skip-on-no-Docker (CI always has it).
    cmds:
      - pnpm exec lingui compile
      - pnpm --filter @junius/shell build
      - cargo build --release -p platform --features embed-frontend
      - pnpm exec tsx e2e/run-suite.ts

  ci:i18n:
    desc: M14 fifth job — full i18n gate (BE + FE catalogs, drift, pseudo).
    cmds:
      # 1. BE + FE catalog validation + extract-drift gate (`--check-drift`
      #    runs `lingui extract` and fails if catalogs need re-extracting).
      - cargo run -q -p junius -- i18n check --config {{.CONFIG}} --check-drift
      # 2. Compile FE catalogs so the pseudo `.js` is fresh before the gate.
      - pnpm exec lingui compile
      # 3. FE pseudo-catalog completeness gate (every msgid → diacritic'd literal).
      - pnpm --filter @junius/plugin-events test

  sqlx:check:
    desc: Verify the committed .sqlx cache is fresh (needs the dev DB + DATABASE_URL).
    cmds:
      - cargo sqlx prepare --workspace --check

  # --- dev infra (the local backing services) -------------------------------

  infra:up:
    desc: Start the dev stack (Postgres, Authentik, RabbitMQ, MinIO, mailpit, LGTM).
    cmds:
      - docker compose -f dev/docker-compose.yml up -d

  infra:down:
    desc: Stop the dev stack (keeps volumes).
    cmds:
      - docker compose -f dev/docker-compose.yml down

  # --- dev convenience (wrap the junius CLI against dev/platform.toml) -------

  sync:
    desc: Regenerate composition glue from the deployment config.
    cmds:
      - "{{.DEV_SECRETS}} cargo run -q -p junius -- sync --config {{.CONFIG}}"

  migrate:
    desc: Apply host + plugin migrations to the dev database.
    cmds:
      - "{{.DEV_SECRETS}} cargo run -q -p junius -- migrate up --config {{.CONFIG}}"

  dev:
    desc: Run the host (juniusd) + Vite dev server.
    cmds:
      - "{{.DEV_SECRETS}} cargo run -q -p junius -- dev --config {{.CONFIG}}"

  build:
    desc: Build the self-contained deployment binary.
    cmds:
      - "{{.DEV_SECRETS}} cargo run -q -p junius -- build --config {{.CONFIG}}"
