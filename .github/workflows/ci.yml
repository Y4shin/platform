name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Repository `query!` macros check against the committed `.sqlx/` offline
    # cache rather than a live DB. A query changed without re-running
    # `cargo sqlx prepare` then has no cache entry and fails the build here; the
    # testcontainers integration tests catch schema drift at runtime.
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: JS — install
        run: nix develop --command pnpm install --frozen-lockfile

      # Single entry point: the same `task ci` developers run locally
      # (fmt-check, clippy, junius check, cargo+vitest tests, biome, buf
      # lint/format). See Taskfile.yml.
      - name: CI gate (task ci)
        run: nix develop --command task ci
        env:
          INSTA_UPDATE: "no"
