name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Repository `query!` macros check against the committed `.sqlx/` offline cache
# rather than a live DB; the `integration` job re-derives + verifies it against a
# real Postgres. A query changed without re-running `cargo sqlx prepare` fails
# there. The six jobs run in parallel; a merge requires all of them green.
env:
  SQLX_OFFLINE: "true"

jobs:
  # Static analysis: fmt, clippy, the no-default-features CLI build, biome, buf
  # lint + format. No compilation of tests, no DB.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: nix develop --command pnpm install --frozen-lockfile
      - name: Lint (task ci:lint)
        run: nix develop --command task ci:lint

  # Build the workspace, run the Rust + JS test suites, and detect breaking proto
  # changes against `main`. Testcontainers integration tests self-provision via
  # the runner's Docker.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `buf breaking` can diff against the `main` branch.
          fetch-depth: 0
      - name: Ensure a local `main` ref for buf breaking
        run: git branch -f main origin/main || true
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: nix develop --command pnpm install --frozen-lockfile
      - name: Build + test (task ci:check)
        run: nix develop --command task ci:check
        env:
          INSTA_UPDATE: "no"

  # Layer 2: migrate a representative deployment (all sample plugins) against an
  # ephemeral Postgres via the CLI, then verify the committed `.sqlx/` cache
  # against the real schema (`cargo sqlx prepare --check`).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: platform_migrator
          POSTGRES_PASSWORD: dev-only
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://platform_migrator:dev-only@localhost:5432/platform
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Migrate + verify .sqlx (task ci:integration)
        run: nix develop --command task ci:integration

  # Build a deployment from `examples/example-deployment/` the way production
  # will: the cheap `--check-config` (resolve + validate, no compile, no DB). The
  # full `junius build` stays gated behind JUNIUS_E2E to keep CI fast.
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Validate the example deployment (task ci:deployment)
        run: nix develop --command task ci:deployment
      - name: Full deployment build (gated)
        if: ${{ env.JUNIUS_E2E == '1' }}
        run: nix develop --command cargo test -p junius --test build_e2e -- --ignored --nocapture

  # M14: validate every plugin + host i18n catalog (`junius i18n check`). Runs
  # independently of the other jobs — no DB or container needed. Fails on
  # missing en.po, schema mismatch, translator-introduced placeholders, or
  # embedded ICU plural syntax in any catalog.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Validate catalogs (task ci:i18n)
        run: nix develop --command task ci:i18n

  # M17: Playwright browser E2E. Per-plugin specs + cross-cutting host
  # journeys. Brings up an ephemeral testcontainers stack (Postgres + RabbitMQ
  # + MinIO + mailpit) — Authentik is omitted because `loginAs` seeds sessions
  # directly. The runner has Docker out of the box; no `services:` block is
  # needed because globalSetup orchestrates containers via testcontainers.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pw-${{ runner.os }}-
      - run: nix develop --command pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: nix develop --command pnpm exec playwright install --with-deps chromium
      - name: E2E (task ci:e2e)
        run: nix develop --command task ci:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # M23: split-mode E2E. Headless juniusd (no `--features embed-frontend`)
  # + a Node SSR FE server in front of it. Same testcontainers stack as
  # the embedded `e2e` job; runs in parallel and must also pass for a merge.
  e2e-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pw-${{ runner.os }}-
      - run: nix develop --command pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: nix develop --command pnpm exec playwright install --with-deps chromium
      - name: E2E split-mode (task ci:e2e:split)
        run: nix develop --command task ci:e2e:split
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-split
          path: |
            playwright-report/
            test-results/
            e2e/.playwright-state-split/
          retention-days: 7
