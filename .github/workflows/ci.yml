name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Repository `query!` macros check against the committed `.sqlx/` offline
    # cache rather than a live DB. A query changed without re-running
    # `cargo sqlx prepare` then has no cache entry and fails the build here; the
    # testcontainers integration tests catch schema drift at runtime.
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: JS — install
        run: nix develop --command pnpm install --frozen-lockfile

      # Single entry point: the same `task ci` developers run locally
      # (fmt-check, clippy, junius check, cargo+vitest tests, biome, buf
      # lint/format). See Taskfile.yml.
      - name: CI gate (task ci)
        run: nix develop --command task ci
        env:
          INSTA_UPDATE: "no"

  # M11: build a deployment from `examples/example-deployment/` the way production
  # will. The default gate runs the cheap `--check-config` (resolve + validate,
  # no compile, no DB); the full `junius build` (which compiles the whole platform
  # release) is gated behind JUNIUS_E2E to keep PR runs fast.
  example-deployment:
    runs-on: ubuntu-latest
    needs: ci
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Set up Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build the junius CLI (release)
        run: nix develop --command cargo build -p junius --release

      - name: Validate the example deployment (no compile, no DB)
        run: |
          nix develop --command bash -c \
            'cd examples/example-deployment && ../../target/release/junius build --check-config'

      - name: Full deployment build (gated)
        if: ${{ env.JUNIUS_E2E == '1' }}
        run: nix develop --command cargo test -p junius --test build_e2e -- --ignored --nocapture
