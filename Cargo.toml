[workspace]
resolver = "2"
members = [
    "platform",
    "tools/junius",
    "crates/junius-sdk",
    "crates/junius-sdk-macros",
    "crates/manifest",
    # >>> junius managed start
    "plugins/hello",
    "plugins/greetings",
    "plugins/widgets",
    # <<< junius managed end
]

[workspace.package]
edition      = "2024"
license      = "AGPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# Async runtime + HTTP
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"
axum        = "0.8"
tower       = "0.5"
tower-http  = "0.6"
http        = "1"

# Errors
anyhow    = "1"
thiserror = "2"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Common domain types
uuid   = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

# Macros
syn         = { version = "2", features = ["full", "extra-traits"] }
quote       = "1"
proc-macro2 = "1"

# Protocol buffers + Connect-RPC. connectrpc (Anthropic's Tower-based Connect
# server) generates service traits; buffa is its zero-copy protobuf. Replaces the
# M05 hand-rolled unary server + prost message types (see M06.5).
connectrpc       = { version = "0.6", features = ["axum", "server"] }
connectrpc-build = "0.6"
buffa            = { version = "0.6", features = ["json"] }
buffa-types      = { version = "0.6", features = ["json"] }
http-body        = "1"

# Database (used heavily from M06)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }

# Migrations + crypto + auth (M06)
petgraph      = "0.6"
sha2          = "0.10"
hmac          = "0.12"
aes-gcm       = "0.10"
rand          = "0.8"
tower-cookies = { version = "0.11", features = ["private"] }
openidconnect = { version = "3", default-features = false, features = ["reqwest", "rustls-tls"] }

# Integration testing against ephemeral Postgres (M06, dev-only)
testcontainers         = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# Workspace crates
junius-manifest    = { path = "crates/manifest" }
junius-sdk         = { path = "crates/junius-sdk" }
junius-sdk-macros  = { path = "crates/junius-sdk-macros" }

# HTTP testing (used by platform's integration tests)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# FE asset embedding (platform host, gated by the `embed-frontend` feature)
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

# CLI
clap   = { version = "4", features = ["derive", "env"] }
regex  = "1"
miette = { version = "7", features = ["fancy"] }

# Test deps
insta      = { version = "1", features = ["yaml"] }
assert_cmd = "2"
predicates = "3"
trybuild   = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic                = { level = "warn", priority = -1 }
unwrap_used             = "warn"
expect_used             = "warn"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"

# Banned APIs are listed in clippy.toml at the workspace root. Bumping the
# lint to `deny` makes any new direct env read (or other banned call) a CI
# failure unless the call site adds a narrow, justified
# `#[allow(clippy::disallowed_methods, reason = "...")]`.
disallowed_methods      = "deny"
