[package]
name         = "junius-manifest"
version      = "0.0.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
publish      = false

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
thiserror  = { workspace = true }
regex      = { workspace = true }
# Role-password derivation (HMAC-SHA256). Pure compute; no IO.
hmac       = { workspace = true }
sha2       = { workspace = true }
# M18 provisioning: stable content-hash of the `[provisioning]` block so a
# host restart with an unchanged config short-circuits the apply.
blake3     = { workspace = true }

[dev-dependencies]
insta = { workspace = true }

[lints]
workspace = true
