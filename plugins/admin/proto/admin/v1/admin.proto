// admin plugin RPC surface (M18 Stage 2). Manages groups, group-roles,
// group memberships, and user-roles (incl. assignments) via the host's
// `PlatformAdminApi` accessor. Every method is gated by an `admin:*`
// permission; the `platform.admin` capability gate is enforced by the
// `PlatformAdminApi` itself at method entry. The `admin` user-role
// (built-in, M18 Stage 1) holds `'*'` and so passes every gate.
syntax = "proto3";

package admin.v1;

import "platform/v1/annotations.proto";

// ---- Groups -----------------------------------------------------------------

service GroupAdminService {
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (platform.v1.requires) = "admin:groups_read";
  }
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {
    option (platform.v1.requires) = "admin:groups_write";
  }
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse) {
    option (platform.v1.requires) = "admin:groups_write";
  }
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {
    option (platform.v1.requires) = "admin:groups_write";
  }

  rpc ListGroupRoles(ListGroupRolesRequest) returns (ListGroupRolesResponse) {
    option (platform.v1.requires) = "admin:groups_read";
  }
  rpc CreateGroupRole(CreateGroupRoleRequest) returns (CreateGroupRoleResponse) {
    option (platform.v1.requires) = "admin:groups_write";
  }
  rpc DeleteGroupRole(DeleteGroupRoleRequest) returns (DeleteGroupRoleResponse) {
    option (platform.v1.requires) = "admin:groups_write";
  }
  rpc SetGroupRolePermissions(SetGroupRolePermissionsRequest) returns (SetGroupRolePermissionsResponse) {
    option (platform.v1.requires) = "admin:groups_write";
  }

  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse) {
    option (platform.v1.requires) = "admin:groups_read";
  }
  rpc AddGroupMember(AddGroupMemberRequest) returns (AddGroupMemberResponse) {
    option (platform.v1.requires) = "admin:groups_write";
  }
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (RemoveGroupMemberResponse) {
    option (platform.v1.requires) = "admin:groups_write";
  }
}

message Group {
  string id = 1;
  string name = 2;
  string description = 3;
}

message GroupRole {
  string id = 1;
  string group_id = 2;
  string name = 3;
  repeated string permissions = 4;
}

message Membership {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string role_id = 4;
  string role_name = 5;
  string managed_by = 6;       // 'manual' | 'oidc' | 'config'
  string managed_source = 7;   // empty when managed_by='manual'
}

message ListGroupsRequest {}
message ListGroupsResponse { repeated Group groups = 1; }

message CreateGroupRequest { string name = 1; string description = 2; }
message CreateGroupResponse { Group group = 1; }

message UpdateGroupRequest { string id = 1; string name = 2; string description = 3; }
message UpdateGroupResponse {}

message DeleteGroupRequest { string id = 1; }
message DeleteGroupResponse {}

message ListGroupRolesRequest { string group_id = 1; }
message ListGroupRolesResponse { repeated GroupRole roles = 1; }

message CreateGroupRoleRequest { string group_id = 1; string name = 2; }
message CreateGroupRoleResponse { GroupRole role = 1; }

message DeleteGroupRoleRequest { string role_id = 1; }
message DeleteGroupRoleResponse {}

message SetGroupRolePermissionsRequest {
  string role_id = 1;
  repeated string permissions = 2;
}
message SetGroupRolePermissionsResponse {}

message ListGroupMembersRequest { string group_id = 1; }
message ListGroupMembersResponse { repeated Membership members = 1; }

message AddGroupMemberRequest {
  string group_id = 1;
  string user_id = 2;
  string role_id = 3;
}
message AddGroupMemberResponse {}

message RemoveGroupMemberRequest { string group_id = 1; string user_id = 2; }
message RemoveGroupMemberResponse {}

// ---- User-roles -------------------------------------------------------------

service UserRoleAdminService {
  rpc ListUserRoles(ListUserRolesRequest) returns (ListUserRolesResponse) {
    option (platform.v1.requires) = "admin:user_roles_read";
  }
  rpc CreateUserRole(CreateUserRoleRequest) returns (CreateUserRoleResponse) {
    option (platform.v1.requires) = "admin:user_roles_write";
  }
  rpc DeleteUserRole(DeleteUserRoleRequest) returns (DeleteUserRoleResponse) {
    option (platform.v1.requires) = "admin:user_roles_write";
  }
  rpc SetUserRolePermissions(SetUserRolePermissionsRequest) returns (SetUserRolePermissionsResponse) {
    option (platform.v1.requires) = "admin:user_roles_write";
  }
  rpc ListUserRoleAssignments(ListUserRoleAssignmentsRequest) returns (ListUserRoleAssignmentsResponse) {
    option (platform.v1.requires) = "admin:user_roles_read";
  }
  rpc AssignUserRole(AssignUserRoleRequest) returns (AssignUserRoleResponse) {
    option (platform.v1.requires) = "admin:user_roles_write";
  }
  rpc RevokeUserRole(RevokeUserRoleRequest) returns (RevokeUserRoleResponse) {
    option (platform.v1.requires) = "admin:user_roles_write";
  }
}

message UserRole {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_builtin = 4;
  repeated string permissions = 5;
}

message UserRoleAssignment {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string role_id = 4;
  string role_name = 5;
}

message ListUserRolesRequest {}
message ListUserRolesResponse { repeated UserRole roles = 1; }

message CreateUserRoleRequest { string name = 1; string description = 2; }
message CreateUserRoleResponse { UserRole role = 1; }

message DeleteUserRoleRequest { string id = 1; }
message DeleteUserRoleResponse {}

message SetUserRolePermissionsRequest {
  string role_id = 1;
  repeated string permissions = 2;
}
message SetUserRolePermissionsResponse {}

message ListUserRoleAssignmentsRequest {}
message ListUserRoleAssignmentsResponse { repeated UserRoleAssignment assignments = 1; }

message AssignUserRoleRequest { string user_id = 1; string role_id = 2; }
message AssignUserRoleResponse {}

message RevokeUserRoleRequest { string user_id = 1; string role_id = 2; }
message RevokeUserRoleResponse {}

// ---- Permission catalogue + user directory ----------------------------------

service PermissionCatalogService {
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (platform.v1.requires) = "admin:groups_read";
  }
}

message PermissionEntry {
  string name = 1;
  string description = 2;
}

message PluginPermissions {
  string plugin = 1;
  string display_name = 2;
  repeated PermissionEntry permissions = 3;
}

message ListPermissionsRequest {}
message ListPermissionsResponse { repeated PluginPermissions plugins = 1; }

service UserAdminService {
  // Look up a user by email — the admin UI's "add member" form takes an
  // email string; this resolves it to a user_id for the subsequent
  // `AddGroupMember` call.
  rpc FindUserByEmail(FindUserByEmailRequest) returns (FindUserByEmailResponse) {
    option (platform.v1.requires) = "admin:groups_read";
  }
}

message FindUserByEmailRequest { string email = 1; }
message FindUserByEmailResponse {
  // Empty `user_id` means "not found"; the UI surfaces that as
  // "no user with that email — have they logged in once yet?".
  string user_id = 1;
  string display_name = 2;
}

// ---- OIDC group mappings ---------------------------------------------------

service OidcMappingAdminService {
  rpc ListOidcMappings(ListOidcMappingsRequest) returns (ListOidcMappingsResponse) {
    option (platform.v1.requires) = "admin:oidc_read";
  }
  rpc CreateOidcMapping(CreateOidcMappingRequest) returns (CreateOidcMappingResponse) {
    option (platform.v1.requires) = "admin:oidc_write";
  }
  rpc DeleteOidcMapping(DeleteOidcMappingRequest) returns (DeleteOidcMappingResponse) {
    option (platform.v1.requires) = "admin:oidc_write";
  }
}

message OidcMapping {
  string id = 1;
  string oidc_group_name = 2;
  string group_id = 3;
  string group_name = 4;
  string role_id = 5;
  string role_name = 6;
}

message ListOidcMappingsRequest {}
message ListOidcMappingsResponse { repeated OidcMapping mappings = 1; }

message CreateOidcMappingRequest {
  string oidc_group_name = 1;
  string group_id = 2;
  string role_id = 3;
}
message CreateOidcMappingResponse { string id = 1; }

message DeleteOidcMappingRequest { string id = 1; }
message DeleteOidcMappingResponse {}
