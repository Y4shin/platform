[plugin]
name = "events"
display_name = "Events"
description = "Events (user- or group-owned, private or public) with sign-up invite pages and iCalendar export."
manifest_schema = 1
# Opt in to a public (login-optional) frontend surface. `junius sync` mounts
# this plugin's `buildPublicRoutes` at `/i/events` outside the authed shell —
# the invite page renders for logged-out visitors (M13).
public_routes = true

# Permissions (M07). `plugin_metadata!()` generates a marker type per key
# (`permissions::EventsRead`, …); repo methods + RPC `option (platform.requires)`
# gate on them. Sign-up itself is not a permission (public invites accept
# anonymous sign-ups; private invites are gated by events:read at the handler).
[permissions]
"events:read" = "View events you own, that belong to your groups, or that are public."
"events:write" = "Create, edit, and delete events and configure their invite pages."
"events:share" = "Share a private event with another user or group."

# Exposed React components (M09). `junius sync` registers these in the host
# component registry; other plugins reach them via `useComponent('events.<name>')`.
# Module paths are relative to this plugin's frontend `src/`.
[exposes.components.EventCard]
module = "./lib/EventCard"
description = "Compact event summary card (title, when, where, visibility)."

[exposes.components.EventPicker]
module = "./lib/EventPicker"
description = "Searchable event selector for cross-plugin reuse."

# The events plugin's own table (M07). Declaring its schema grants role_events
# DML on it; the schema + table are created by migrations/0001_event.up.sql.
# Only `event` is exposed; invite/signup/calendar tables stay private.
[exposes.tables.event]
schema = "events"
description = "Events (public ones are world-readable; private ones gated by ownership)."

# Capabilities (M10). A sign-up enqueues a confirmation-email job (job.enqueue);
# the worker sends it via the email transport (email.send). Both handles are gated
# on these declarations.
[requires]
capabilities = ["email.send", "job.enqueue"]
