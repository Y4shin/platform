// Hello plugin RPC surface. `Greet` is the M05 smoke test (no permission).
// M07 adds greeting CRUD gated by `option (platform.v1.requires)`, enforced by
// the host RPC guard + the typed permission witness in each handler.
syntax = "proto3";

package hello.v1;

import "platform/v1/annotations.proto";

service HelloService {
  rpc Greet(GreetRequest) returns (GreetResponse);

  rpc ListGreetings(ListGreetingsRequest) returns (ListGreetingsResponse) {
    option (platform.v1.requires) = "hello:read";
  }

  rpc CreateGreeting(CreateGreetingRequest) returns (CreateGreetingResponse) {
    option (platform.v1.requires) = "hello:read,hello:write";
  }
}

message GreetRequest {
  string name = 1;
}

message GreetResponse {
  string message = 1;
}

message Greeting {
  string id = 1;
  string name = 2;
  string body = 3;
  string created = 4; // RFC 3339 timestamp
}

message ListGreetingsRequest {}

message ListGreetingsResponse {
  repeated Greeting greetings = 1;
}

message CreateGreetingRequest {
  string name = 1;
  string body = 2;
}

message CreateGreetingResponse {
  Greeting greeting = 1;
}

// --- notes: per-instance access-controlled resource (M08) -------------------

service NoteService {
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse) {
    option (platform.v1.requires) = "hello:read";
  }
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse) {
    option (platform.v1.requires) = "hello:read";
  }
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse) {
    option (platform.v1.requires) = "hello:read,hello:write";
  }
  // The owner-only check is enforced host-side in authz.share; the caller just
  // needs to be able to see the note.
  rpc ShareNote(ShareNoteRequest) returns (ShareNoteResponse) {
    option (platform.v1.requires) = "hello:read";
  }
}

message Note {
  string id = 1;
  string title = 2;
  string body = 3;
  string created = 4; // RFC 3339
  bool viewer_can_edit = 5;
  bool viewer_can_share = 6;
}

message ListNotesRequest {}

message ListNotesResponse {
  repeated Note notes = 1;
}

message GetNoteRequest {
  string id = 1;
}

message GetNoteResponse {
  Note note = 1;
}

message CreateNoteRequest {
  string title = 1;
  string body = 2;
}

message CreateNoteResponse {
  Note note = 1;
}

message ShareNoteRequest {
  string id = 1;
  string principal_kind = 2; // 'user' | 'group' | 'public'
  string principal_id = 3; // user/group UUID; empty for 'public'
  string permission = 4;
}

message ShareNoteResponse {
  string share_id = 1;
}
