# M23 split-mode example: juniusd (headless) + frontend-ssr (Node) +
# postgres + rabbitmq + minio + authentik. Browser → :3000 (frontend-ssr).
# The SSR container reaches juniusd at `http://juniusd:18080` over the
# docker network; only juniusd talks to postgres.
#
#   docker compose up --build
#
# Required env (export or use a .env file alongside this docker-compose.yml):
#   OIDC_CLIENT_SECRET, SESSION_KEY, ROLE_PW_SECRET, STORAGE_TOKEN_SECRET,
#   MINIO_USER, MINIO_PASS, AUTHENTIK_SECRET_KEY
#
# The two containers are built from the monorepo root via two Dockerfiles
# (not included in this stage — M24 ships the precompiled images on
# ghcr.io; until then, set `build:` to point at the local Dockerfiles
# you write, or to the M24 image tags once published).

services:
  juniusd:
    # Replace with `image: ghcr.io/.../junius-backend:<tag>` once M24 lands.
    build:
      context: ../..
      dockerfile: examples/example-deployment-split/Dockerfile.juniusd
    environment:
      JUNIUS_CONFIG: /etc/junius/platform.toml
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SESSION_KEY: ${SESSION_KEY}
      ROLE_PW_SECRET: ${ROLE_PW_SECRET}
      STORAGE_TOKEN_SECRET: ${STORAGE_TOKEN_SECRET}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASS: ${MINIO_PASS}
    volumes:
      - ./platform.toml:/etc/junius/platform.toml:ro
    expose:
      - "18080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  frontend-ssr:
    # Replace with `image: ghcr.io/.../junius-frontend:<tag>` once M24 lands.
    build:
      context: ../..
      dockerfile: examples/example-deployment-split/Dockerfile.frontend-ssr
    environment:
      NODE_ENV: production
      PORT: "3000"
      # SSR fetches + the proxy target both resolve via docker-compose DNS.
      JUNIUS_BE_INTERNAL_URL: http://juniusd:18080
    ports:
      - "3000:3000"
    depends_on:
      - juniusd

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: platform_migrator
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_migrator -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    volumes:
      - minio-data:/data

  # Authentik (server + worker + postgres + redis) — same shape as
  # dev/docker-compose.yml but trimmed to one block here; copy the
  # full stanza from dev/docker-compose.yml for a real deployment.
  # (Omitted for brevity in this example; rely on the dev compose file
  # when running M23 e2e locally.)

volumes:
  postgres-data:
  minio-data:
