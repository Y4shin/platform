# M24 precompiled `split`: M23 SSR topology served by prebuilt images.
# Browser → :3000 (frontend); the frontend container proxies `/api`, `/h`,
# `/rpc` to the backend container at `JUNIUS_BE_INTERNAL_URL`. Only
# port 3000 is published — keep the backend on the docker network.
#
#   docker compose up
#
# Migrations: run once before first boot:
#   docker compose run --rm juniusd junius migrate up

services:
  juniusd:
    image: ghcr.io/${JUNIUS_OWNER:-junius/junius}/junius-backend:${JUNIUS_TAG:-latest}
    environment:
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SESSION_KEY: ${SESSION_KEY}
      ROLE_PW_SECRET: ${ROLE_PW_SECRET}
    volumes:
      - ./platform.toml:/etc/junius/platform.toml:ro
    expose:
      - "18080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ghcr.io/${JUNIUS_OWNER:-junius/junius}/junius-frontend:${JUNIUS_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "3000"
      JUNIUS_BE_INTERNAL_URL: http://juniusd:18080
    ports:
      - "3000:3000"
    depends_on:
      - juniusd
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: platform_migrator
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_migrator -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
