[package]
name         = "platform"
version      = "0.0.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
publish      = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "juniusd"
path = "src/main.rs"

[features]
default = []
# When enabled, juniusd serves the embedded SPA from platform/frontend/dist/.
# `junius build` flips this on; `cargo run -p platform` from a dev shell
# leaves it off (Vite serves the FE directly instead).
embed-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
junius-sdk = { workspace = true }

axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

# >>> junius managed start
hello-plugin = { path = "../plugins/hello" }
# <<< junius managed end

[dev-dependencies]
http       = { workspace = true }
reqwest    = { workspace = true }
prost      = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
