[package]
name         = "platform"
version      = "0.0.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
publish      = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "juniusd"
path = "src/main.rs"

[features]
default = []
# When enabled, juniusd serves the embedded SPA from platform/frontend/dist/.
# `junius build` flips this on; `cargo run -p platform` from a dev shell
# leaves it off (Vite serves the FE directly instead).
embed-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
junius-sdk      = { workspace = true }
junius-manifest = { workspace = true }

axum               = { workspace = true }
connectrpc         = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# OTel export — host-only; bridges `tracing` spans/logs + the metrics sink to LGTM.
opentelemetry                  = { workspace = true }
opentelemetry_sdk              = { workspace = true }
opentelemetry-otlp             = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry          = { workspace = true }

# Email transports (host-only): SMTP/mailpit via lettre; Resend via reqwest.
lettre = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }

# Job queue over RabbitMQ (host-only).
lapin          = { workspace = true }
deadpool-lapin = { workspace = true }
futures-lite   = { workspace = true }
tokio-util     = { workspace = true }

# Object storage over S3-compatible backends (host-only).
rust-s3 = { workspace = true }

# DB + auth (M06)
sqlx          = { workspace = true }
uuid          = { workspace = true }
chrono        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tower-cookies = { workspace = true }
aes-gcm       = { workspace = true }
rand          = { workspace = true }
sha2          = { workspace = true }
hmac          = { workspace = true }
reqwest       = { workspace = true }
openidconnect = { workspace = true }

rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

# >>> junius managed start
hello-plugin = { path = "../plugins/hello" }
greetings-plugin = { path = "../plugins/greetings" }
widgets-plugin = { path = "../plugins/widgets" }
events-plugin = { path = "../plugins/events" }
# <<< junius managed end

[dev-dependencies]
http = { workspace = true }

# Ephemeral Postgres for the auth integration tests (M06).
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true }
tempfile               = { workspace = true }

[lints]
workspace = true
