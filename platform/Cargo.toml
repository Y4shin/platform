[package]
name         = "platform"
version      = "0.0.0"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
publish      = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "juniusd"
path = "src/main.rs"

[features]
default = []
# When enabled, juniusd serves the embedded SPA from platform/frontend/dist/.
# `junius build` flips this on; `cargo run -p platform` from a dev shell
# leaves it off (Vite serves the FE directly instead).
embed-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
junius-sdk      = { workspace = true }
junius-manifest = { workspace = true }

axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# DB + auth (M06)
sqlx          = { workspace = true }
uuid          = { workspace = true }
chrono        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tower-cookies = { workspace = true }
aes-gcm       = { workspace = true }
rand          = { workspace = true }
sha2          = { workspace = true }
reqwest       = { workspace = true }
openidconnect = { workspace = true }

rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }

# >>> junius managed start
hello-plugin = { path = "../plugins/hello" }
# <<< junius managed end

[dev-dependencies]
http  = { workspace = true }
prost = { workspace = true }

# Ephemeral Postgres for the auth integration tests (M06).
testcontainers         = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
